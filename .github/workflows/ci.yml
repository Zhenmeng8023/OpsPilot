name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vulnerability scan (Go)
        shell: pwsh
        run: ../scripts/govulncheck.ps1

      - name: Check migration pairs
        shell: pwsh
        run: ../scripts/migration-check.ps1 -SkipExecution

      - name: Check OpenAPI routes
        shell: pwsh
        run: ../scripts/openapi-router-check.ps1

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Vulnerability scan (npm high+)
        run: npm audit --audit-level=high --omit=dev --registry=https://registry.npmjs.org

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate compose config
        run: docker compose -f deploy/docker-compose.yml --profile full config

      - name: Build API image
        run: docker build -f server/Dockerfile --build-arg APP_VERSION="$(cat VERSION)" .

      - name: Build Web image
        run: docker build -f web/Dockerfile .

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start full stack
        env:
          SCHEDULE_SCAN_INTERVAL_SECONDS: 2
          ALERT_SCAN_INTERVAL_SECONDS: 2
          NOTIFICATION_DISPATCH_INTERVAL_SECONDS: 2
          METRIC_ROLLUP_INTERVAL_SECONDS: 3600
          METRIC_RETENTION_INTERVAL_SECONDS: 3600
        run: docker compose -p opspilot-e2e -f deploy/docker-compose.yml --profile full up --build -d

      - name: Run E2E smoke
        shell: pwsh
        run: ./scripts/e2e-smoke.ps1 -ApiBaseUrl http://127.0.0.1:8080 -ScheduleTimeoutSeconds 180

      - name: Verify schema migrations were recorded
        shell: bash
        run: |
          recorded="$(docker compose -p opspilot-e2e -f deploy/docker-compose.yml exec -T mysql sh -lc 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE status IN (\"applied\",\"legacy\",\"skipped\")"' )"
          test "$recorded" -ge 6

      - name: Set up Node.js for Playwright smoke
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --include=optional --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        working-directory: web
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5173
          SMOKE_USERNAME: admin
          SMOKE_PASSWORD: Admin@123456
        run: npm run test:smoke

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Verify encrypted notification config at rest
        shell: bash
        run: |
          value="$(docker compose -p opspilot-e2e -f deploy/docker-compose.yml exec -T mysql sh -lc 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT config FROM notification_channels WHERE config IS NOT NULL ORDER BY id DESC LIMIT 1"' )"
          test -n "$value"
          echo "$value" | grep '"_encrypted"'
          ! echo "$value" | grep -q 'smoke-channel-secret'

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -p opspilot-e2e -f deploy/docker-compose.yml --profile full logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose -p opspilot-e2e -f deploy/docker-compose.yml --profile full down -v
