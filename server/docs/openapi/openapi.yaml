      description: Requires `notification:write`. Template placeholders include `{{title}}`, `{{content}}`, `{{severity}}`, `{{resourceType}}`, and `{{resourceId}}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplatePayload"
      responses:
        "200": { description: Notification template summary }
  /api/v1/notification-templates/{id}:
    put:
      summary: Update notification template
      description: Requires `notification:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplatePayload"
      responses:
        "200": { description: Notification template summary }
  /api/v1/notification-deliveries:
    get:
      summary: List notification deliveries
      description: Requires `notification:read`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, sending, success, failed, canceled] }
        - name: channelId
          in: query
          schema: { type: string }
        - name: notificationId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Notification delivery list }
  /api/v1/notification-deliveries/{id}/retry:
    post:
      summary: Retry notification delivery
      description: Requires `notification:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/notification-deliveries/bulk-retry:
    post:
      summary: Bulk retry failed notification deliveries
      description: Requires `notification:write`. Resets matching failed deliveries to pending for dispatcher retry.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [failed], default: failed }
                channelId: { type: string }
                notificationId: { type: string }
                limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: Bulk retry result }
  /api/v1/notifications:
    get:
      summary: List notifications
      description: Requires `notification:read`.
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        "200": { description: Notification list }
  /api/v1/notifications/{id}/read:
    post:
      summary: Mark notification read
      description: Requires `notification:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/audit-logs:
    get:
      summary: List audit logs
      description: Requires `audit.read`. Returns redacted audit records for the default workspace plus system-level records.
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, agent, webhook, system] }
        - name: result
          in: query
          schema: { type: string, enum: [success, failed, denied] }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: resourceId
          in: query
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/keyword"
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
  /api/v1/trace-center:
    get:
      summary: Search trace center timeline
      description: Requires `audit.read`. Correlates trace/workflow/task/webhook into a single troubleshooting timeline.
      parameters:
        - name: traceId
          in: query
          schema: { type: string }
        - name: taskRunId
          in: query
          schema: { type: string }
        - name: workflowRunId
          in: query
          schema: { type: string }
        - name: webhookEventId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Trace center timeline result }
  /api/v1/audit-logs/export:
    get:
      summary: Export audit logs
      description: Requires `audit.read`. Supports JSON and CSV export with the same filters as list.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
        - name: action
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, agent, webhook, system] }
        - name: result
          in: query
          schema: { type: string, enum: [success, failed, denied] }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: resourceId
          in: query
          schema: { type: string }
        - name: traceId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/keyword"
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Downloaded audit export file }
  /api/v1/audit-logs/retention/run:
    post:
      summary: Run audit log retention
      description: Requires `audit.read`. Supports dry run and execute mode.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun: { type: boolean, default: true }
                days: { type: integer, minimum: 1 }
      responses:
        "200": { description: Retention execution result }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentTokenAuth:
      type: http
      scheme: bearer
      description: Agent Token, not user JWT.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    keyword:
      name: keyword
      in: query
      schema: { type: string }
    status:
      name: status
      in: query
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    afterSequence:
      name: afterSequence
      in: query
      schema: { type: integer, minimum: 0 }
  schemas:
    ScriptPayload:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        description: { type: string }
        scriptType: { type: string, enum: [shell, bash, powershell] }
        content: { type: string }
        changeSummary: { type: string }
    CreateTaskPayload:
      type: object
      required: [name, timeoutSeconds]
      properties:
        name: { type: string }
        description: { type: string }
        scriptId: { type: string }
        command: { type: string }
        scriptType: { type: string, enum: [shell, bash, powershell] }
        timeoutSeconds: { type: integer, minimum: 1 }
        targetAgentIds:
          type: array
          items: { type: string }
        targetHostIds:
          type: array
          items: { type: string }
    EnrollmentTokenPayload:
      type: object
      properties:
        maxUses: { type: integer, minimum: 1, default: 1 }
        expiresInSeconds: { type: integer, minimum: 60, default: 3600 }
        bindWorkspaceSlug: { type: string }
    MaintenanceWindowPayload:
      type: object
      required: [name, startsAt, endsAt]
      properties:
        name: { type: string }
        scopeType: { type: string, enum: [all, agent, host, group], default: all }
        agentId: { type: string }
        hostId: { type: string }
        hostGroupId: { type: string }
        reason: { type: string }
        startsAt: { type: string, example: "2026-05-08 10:00:00" }
        endsAt: { type: string, example: "2026-05-08 12:00:00" }
        status: { type: string, enum: [active, disabled, archived], default: active }
    TagPayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string, example: "#2f7d99" }
    ResourceTagsPayload:
      type: object
      properties:
        tagIds:
          type: array
          items: { type: string }
    HostGroupPayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        hostIds:
          type: array
          items: { type: string }
    HostGroupMembersPayload:
      type: object
      properties:
        hostIds:
          type: array
          items: { type: string }
    SchedulePayload:
      type: object
      required: [name, cronExpr]
      properties:
        name: { type: string }
        targetType: { type: string, enum: [task, workflow], default: task }
        taskId: { type: string }
        workflowId: { type: string }
        cronExpr: { type: string, example: "*/5 * * * *" }
        timezone: { type: string, example: Asia/Shanghai }
        misfirePolicy: { type: string, enum: [skip, fire_once, fire_all], default: skip }
    SchedulePreviewPayload:
      type: object
      required: [cronExpr]
      properties:
        cronExpr: { type: string, example: "*/5 * * * *" }
        timezone: { type: string, example: Asia/Shanghai }
        count: { type: integer, minimum: 1, maximum: 20, default: 5 }
    WebhookSourcePayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sourceType: { type: string, enum: [github, gitee, gitlab, custom], default: custom }
    WebhookRulePayload:
      type: object
      required: [sourceId, name]
      properties:
        sourceId: { type: string }
        targetType: { type: string, enum: [task, workflow], default: task }
        taskId: { type: string }
        workflowId: { type: string }
        name: { type: string }
        eventType: { type: string }
        matcher:
          type: object
          properties:
            conditions:
              type: array
              items:
                type: object
                required: [type]
                properties:
                  type: { type: string, enum: [header_equals, payload_equals, payload_contains, payload_not_equals, payload_exists, payload_regex, event_type_equals, ref_equals, branch_equals] }
                  key: { type: string, example: X-GitHub-Event }
                  path: { type: string, example: commits[*].author.name }
                  value: { type: string, example: push, description: Optional only for `payload_exists`; otherwise required. }
    MetricsUploadPayload:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          items:
            type: object
            required: [code, value]
            properties:
              code: { type: string, example: agent.runtime.goroutines }
              value: { type: number }
              unit: { type: string, example: count }
              dimensions: { type: object, additionalProperties: true }
              collectedAt: { type: string, format: date-time }
    MetricDashboardPayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        metricCode: { type: string, example: agent.os.cpu.percent }
        hostId: { type: string }
        agentId: { type: string }
        rangeHours: { type: integer, minimum: 1, maximum: 336, default: 24 }
        pointLimit: { type: integer, minimum: 10, maximum: 240, default: 120 }
        granularity:
          type: string
          enum: [auto, raw, 5m, 1h]
          default: auto
        status:
          type: string
          enum: [active, disabled, archived]
          default: active
    MetricRollupPayload:
      type: object
      properties:
        interval:
          type: string
          enum: [5m, 1h]
          default: 5m
        hours: { type: integer, minimum: 1, maximum: 720, default: 24 }
    MetricRetentionPayload:
      type: object
      properties:
        detailDays: { type: integer, minimum: 1, default: 7 }
        rollupDays: { type: integer, minimum: 1, default: 90 }
        dryRun: { type: boolean, default: true }
    AlertRulePayload:
      type: object
      required: [name, metricCode, operator]
      properties:
        name: { type: string }
        metricCode: { type: string, example: agent.os.cpu.percent }
        operator: { type: string, enum: [">", ">=", "<", "<=", "==", "!="] }
        threshold: { type: number }
        durationSeconds:
          type: integer
          minimum: 0
          default: 60
          description: Required continuous breach window in seconds before firing.
        cooldownSeconds: { type: integer, minimum: 0, default: 0 }
        severity: { type: string, enum: [info, warning, critical], default: warning }
    AlertSuppressionRulePayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ruleId: { type: string }
        hostId: { type: string }
        hostGroupId: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [active, disabled, archived], default: active }
    AlertRoutingPolicyPayload:
      type: object
      required: [name, channelId]
      properties:
        name: { type: string }
        ruleId: { type: string }
        hostId: { type: string }
        hostGroupId: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        channelId: { type: string }
        status: { type: string, enum: [active, disabled, archived], default: active }
    AlertGroupSummary:
      type: object
      properties:
        id: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        hostGroupId: { type: string }
        hostGroupName: { type: string }
        title: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [firing, acknowledged, silenced, resolved] }
        fingerprint: { type: string }
        alertCount: { type: integer }
        activeCount: { type: integer }
        firingCount: { type: integer }
        acknowledgedCount: { type: integer }
        silencedCount: { type: integer }
        resolvedCount: { type: integer }
        hostCount: { type: integer }
        hosts:
          type: array
          items: { type: string }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        resolvedAt: { type: string }
    NoisyRuleSummary:
      type: object
      properties:
        ruleId: { type: string }
        ruleName: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        alertCount: { type: integer }
        activeCount: { type: integer }
        hostCount: { type: integer }
        lastSeenAt: { type: string }
    AlertNoiseTrendPoint:
      type: object
      properties:
        bucketStart: { type: string }
        hostGroupId: { type: string }
        hostGroupName: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        alertCount: { type: integer }
    AlertDryRunPayload:
      type: object
      properties:
        ruleId: { type: string }
        hostId: { type: string }
        hostGroupId: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
    AlertRoutingDryRunPayload:
      allOf:
        - $ref: "#/components/schemas/AlertDryRunPayload"
        - type: object
          required: [channelId]
          properties:
            channelId: { type: string }
    DryRunExplanation:
      type: object
      properties:
        dimension: { type: string }
        value: { type: string }
        matched: { type: boolean }
        reason: { type: string }
    AlertSuppressionDryRunResult:
      type: object
      properties:
        matchedAlerts: { type: integer }
        sampleAlertIds:
          type: array
          items: { type: string }
        explanations:
          type: array
          items:
            $ref: "#/components/schemas/DryRunExplanation"
    AlertRoutingDryRunResult:
      type: object
      properties:
        matchedAlerts: { type: integer }
        matchedPolicies: { type: integer }
        sampleAlertIds:
          type: array
          items: { type: string }
        policyIds:
          type: array
          items: { type: string }
        explanations:
          type: array
          items:
            $ref: "#/components/schemas/DryRunExplanation"
    IncidentSummary:
      type: object
      properties:
        id: { type: string }
        alertId: { type: string }
        title: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [open, acknowledged, silenced, resolved] }
        owner: { type: string }
        impactScope: { type: string }
        rootCause: { type: string }
        mergedInto: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        hostId: { type: string }
        hostName: { type: string }
        message: { type: string }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        resolvedAt: { type: string }
        alertCount: { type: integer }
    IncidentEvent:
      type: object
      properties:
        id: { type: integer }
        eventType: { type: string }
        message: { type: string }
        actor: { type: string }
        payload: { type: string, description: JSON string payload. }
        createdAt: { type: string }
    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/IncidentSummary"
        - type: object
          properties:
            postmortem: { type: string }
            events:
              type: array
              items:
                $ref: "#/components/schemas/IncidentEvent"
    IncidentLifecycleUpdatePayload:
      type: object
      properties:
        owner: { type: string }
        impactScope: { type: string }
        rootCauseClass: { type: string }
        postmortem: { type: string }
    IncidentMergePayload:
      type: object
      required: [targetIncidentId]
      properties:
        targetIncidentId: { type: string }
        reason: { type: string }
    IncidentClosePayload:
      type: object
      properties:
        reason: { type: string }
    WorkflowDefinitionPayload:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        description: { type: string }
        definition:
          type: string
          description: JSON string containing nodes, edges, maxParallel, node timeoutSeconds, and failurePolicy (`stop_on_failure`, `stop_workflow`, `skip_downstream`, or `continue`).
          example: '{"nodes":[{"id":"collect","type":"task","name":"Collect diagnostics","timeoutSeconds":900,"config":{"taskId":"task_01"}}],"edges":[],"maxParallel":1,"failurePolicy":"skip_downstream"}'
    WorkflowDefinitionSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, active, disabled, archived] }
        nodeCount: { type: integer }
        edgeCount: { type: integer }
        createdBy: { type: string }
        publishedAt: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    WorkflowDefinitionDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowDefinitionSummary"
        - type: object
          properties:
            definition: { type: string, description: Normalized workflow DAG JSON string. }
    WorkflowDefinitionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowDefinitionSummary"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    WorkflowVersionSummary:
      type: object
      properties:
        id: { type: string }
        workflowId: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, published, deprecated, archived] }
        definitionHash: { type: string }
        createdBy: { type: string }
        publishedAt: { type: string }
        createdAt: { type: string }
    WorkflowRunPayload:
      type: object
      properties:
        triggerType: { type: string, enum: [manual, schedule, webhook, incident, api, retry], default: manual }
        idempotencyKey: { type: string }
        input: { type: string, description: JSON string input for the workflow run. }
    WorkflowRunSummary:
      type: object
      properties:
        id: { type: string }
        workflowId: { type: string }
        workflowName: { type: string }
        workflowVersion: { type: integer }
        status: { type: string, enum: [pending, queued, running, canceling, success, failed, canceled] }
        triggerType: { type: string }
        totalNodes: { type: integer }
        successNodes: { type: integer }
        failedNodes: { type: integer }
        skippedNodes: { type: integer }
        errorMessage: { type: string }
        createdBy: { type: string }
        queuedAt: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        createdAt: { type: string }
    WorkflowRunNode:
      type: object
      properties:
        id: { type: integer }
        nodeId: { type: string }
        nodeType: { type: string, enum: [task, condition, approval, notification, webhook, wait, incident] }
        nodeName: { type: string }
        status: { type: string, enum: [pending, queued, running, success, failed, skipped, canceled] }
        taskRunId: { type: string }
        errorMessage: { type: string }
        attempts: { type: integer }
        queuedAt: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
    WorkflowRunEvent:
      type: object
      properties:
        id: { type: integer }
        nodeId: { type: string }
        eventType: { type: string }
        message: { type: string }
        actor: { type: string }
        payload: { type: string, description: JSON string payload. }
        createdAt: { type: string }
    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRunSummary"
        - type: object
          properties:
            input: { type: string }
            output: { type: string }
            definition: { type: string, description: Workflow definition snapshot JSON string. }
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowRunNode"
            events:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowRunEvent"
    WorkflowRunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRunSummary"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    NotificationChannelPayload:
      type: object
      required: [name]
      properties:
        name: { type: string }
        channelType: { type: string, enum: [site, email, webhook, dingtalk, wechat, slack], default: site }
        config:
          type: object
          description: For `email`, use `email`; for outbound webhook-style channels, use `url` and optional `signingSecret`.
          additionalProperties: true
    NotificationTemplatePayload:
      type: object
      required: [name, titleTemplate]
      properties:
        name: { type: string }
        category: { type: string, default: system }
        channelType: { type: string, enum: [any, site, email, webhook, dingtalk, wechat, slack], default: any }
        titleTemplate: { type: string, example: "[{{severity}}] {{title}}" }
        contentTemplate: { type: string, example: "{{content}}\nResource: {{resourceType}} #{{resourceId}}" }
        status: { type: string, enum: [active, disabled, archived], default: active }
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        actorType: { type: string, enum: [user, agent, webhook, system] }
        actorUser: { type: string }
        actorAgent: { type: string }
        action: { type: string, example: task.create }
        resourceType: { type: string, example: task_run }
        resourceId: { type: integer }
        result: { type: string, enum: [success, failed, denied] }
        ip: { type: string }
        userAgent: { type: string }
        traceId: { type: string }
        requestMethod: { type: string, example: POST }
        requestPath: { type: string, example: /api/v1/tasks }
        before: { type: string, description: Redacted JSON string. }
        after: { type: string, description: Redacted JSON string. }
        metadata: { type: string, description: Redacted JSON string. }
        createdAt: { type: string }
