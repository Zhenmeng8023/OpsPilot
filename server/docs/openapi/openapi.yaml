openapi: 3.1.0
info:
  title: OpsPilot API
  version: 0.7.0-dev
  description: OpsPilot auth, RBAC, Agent, Host, script, task execution, logs, scheduling, webhooks, metrics, alerts, and notifications API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK }
  /api/v1/version:
    get:
      security: []
      summary: Version metadata
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      service: { type: string, example: OpsPilot }
                      version: { type: string, example: 0.7.0-dev }
                      commit: { type: string, example: abc1234 }
                      buildTime: { type: string, example: "2026-05-07T00:00:00Z" }
                      goVersion: { type: string, example: go1.26.2 }
                      env: { type: string, example: prod }
                  traceId: { type: string }
  /api/v1/ping:
    get:
      security: []
      summary: API ping
      responses:
        "200": { description: Pong }
  /api/v1/auth/register:
    post:
      security: []
      summary: Register user
      responses:
        "200": { description: Auth response }
  /api/v1/auth/login:
    post:
      security: []
      summary: Login user
      responses:
        "200": { description: Auth response }
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Refresh JWT
      responses:
        "200": { description: Auth response }
  /api/v1/auth/logout:
    post:
      security: []
      summary: Logout and revoke refresh token
      responses:
        "200": { description: OK }
  /api/v1/me:
    get:
      summary: Current user profile
      responses:
        "200": { description: User profile }
  /api/v1/users:
    get:
      summary: List users
      description: Requires `user.read`.
      responses:
        "200": { description: User list }
    post:
      summary: Create user
      description: Requires `user.write`.
      responses:
        "200": { description: Created user }
  /api/v1/users/{id}/status:
    patch:
      summary: Update user status
      description: Requires `user.write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/users/{id}/roles:
    put:
      summary: Update user roles
      description: Requires `role.write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: User }
  /api/v1/permissions:
    get:
      summary: List permissions
      description: Requires `role.read`.
      responses:
        "200": { description: Permission list }
  /api/v1/roles:
    get:
      summary: List roles
      description: Requires `role.read`.
      responses:
        "200": { description: Role list }
    post:
      summary: Create role
      description: Requires `role.write`.
      responses:
        "200": { description: Role }
  /api/v1/roles/{id}/permissions:
    put:
      summary: Update role permissions
      description: Requires `role.write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Role }
  /api/v1/agents/register:
    post:
      security: []
      summary: Register Agent with bootstrap secret
      responses:
        "200": { description: Agent and one-time plaintext token }
  /api/v1/agents/heartbeat:
    post:
      security:
        - agentTokenAuth: []
      summary: Agent heartbeat
      responses:
        "200": { description: Heartbeat result }
  /api/v1/agents:
    get:
      summary: List Agents
      description: Requires `agent:read`.
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/status"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200": { description: Paged Agent list }
  /api/v1/agents/diagnostics:
    get:
      summary: List Agent diagnostic snapshots
      description: Requires `agent:read`.
      responses:
        "200": { description: Agent diagnostic snapshot list }
  /api/v1/agents/fleet-distribution:
    get:
      summary: List Agent version distribution and stale reasons
      description: Requires `agent:read`.
      responses:
        "200": { description: Fleet distribution summary }
  /api/v1/agents/diagnostics/diff:
    get:
      summary: Compare two Agent diagnostic snapshots
      description: Requires `agent:read`.
      parameters:
        - name: left
          in: query
          required: true
          schema: { type: string }
        - name: right
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Diagnostic diff result }
  /api/v1/agents/offline-scan:
    post:
      summary: Scan Agents and Hosts offline
      description: Requires `agent:write`.
      responses:
        "200": { description: Offline scan result }
  /api/v1/agents/{id}/disable:
    post:
      summary: Disable Agent
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/agents/{id}/revoke-token:
    post:
      summary: Revoke active Agent Token
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/agents/{id}/tags:
    put:
      summary: Replace Agent tags
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTagsPayload"
      responses:
        "200": { description: Tag list for the Agent }
  /api/v1/hosts:
    get:
      summary: List Hosts
      description: Requires `host:read`.
      responses:
        "200": { description: Paged Host list }
  /api/v1/hosts/{id}/tags:
    put:
      summary: Replace Host tags
      description: Requires `host:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTagsPayload"
      responses:
        "200": { description: Tag list for the Host }
  /api/v1/tags:
    get:
      summary: List fleet tags
      description: Requires `agent:read`.
      responses:
        "200": { description: Tag list }
    post:
      summary: Create fleet tag
      description: Requires `agent:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPayload"
      responses:
        "200": { description: Tag summary }
  /api/v1/tags/{id}:
    put:
      summary: Update fleet tag
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPayload"
      responses:
        "200": { description: Tag summary }
  /api/v1/host-groups:
    get:
      summary: List Host Groups
      description: Requires `host:read`.
      responses:
        "200": { description: Host Group list }
    post:
      summary: Create Host Group
      description: Requires `host:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostGroupPayload"
      responses:
        "200": { description: Host Group summary }
  /api/v1/host-groups/{id}:
    put:
      summary: Update Host Group
      description: Requires `host:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostGroupPayload"
      responses:
        "200": { description: Host Group summary }
  /api/v1/host-groups/{id}/members:
    put:
      summary: Replace Host Group members
      description: Requires `host:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostGroupMembersPayload"
      responses:
        "200": { description: Host Group summary }
  /api/v1/host-groups/{id}/disable-agents:
    post:
      summary: Disable all Agents in a Host Group
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Host Group batch operation result }
  /api/v1/host-groups/{id}/disable-agents/plan:
    get:
      summary: Preview batch-disable execution plan for a Host Group
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: batchSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: maxBatches
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: stopOnFailure
          in: query
          schema: { type: boolean }
      responses:
        "200": { description: Host Group batch planner result }
  /api/v1/host-groups/{id}/diagnostics:
    get:
      summary: List latest Agent diagnostics for a Host Group
      description: Requires `agent:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Agent diagnostic snapshot list }
  /api/v1/maintenance-windows:
    get:
      summary: List Agent maintenance windows
      description: Requires `agent:read`.
      responses:
        "200": { description: Maintenance window list }
    post:
      summary: Create Agent maintenance window
      description: Requires `agent:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowPayload"
      responses:
        "200": { description: Maintenance window summary }
  /api/v1/maintenance-windows/{id}:
    put:
      summary: Update Agent maintenance window
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindowPayload"
      responses:
        "200": { description: Maintenance window summary }
  /api/v1/agent-enrollment-tokens:
    get:
      summary: List Agent enrollment tokens
      description: Requires `agent:read`.
      responses:
        "200": { description: Enrollment token list }
    post:
      summary: Create one-time Agent enrollment token
      description: Requires `agent:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentTokenPayload"
      responses:
        "200": { description: Enrollment token detail with one-time plaintext token }
  /api/v1/agent-enrollment-tokens/{id}/revoke:
    post:
      summary: Revoke Agent enrollment token
      description: Requires `agent:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/scripts:
    get:
      summary: List script templates
      description: Requires `script:read`.
      responses:
        "200": { description: Script list }
    post:
      summary: Create script template
      description: Requires `script:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptPayload"
      responses:
        "200": { description: Script detail }
  /api/v1/scripts/{id}:
    get:
      summary: Get script detail
      description: Requires `script:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Script detail }
    put:
      summary: Update script template and create new revision if content changes
      description: Requires `script:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Script detail }
  /api/v1/scripts/{id}/disable:
    post:
      summary: Disable script template
      description: Requires `script:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/scripts/{id}/approval:
    post:
      summary: Request script approval for latest revision
      description: Requires `script:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Approval summary }
  /api/v1/script-approvals:
    get:
      summary: List script approvals
      description: Requires `script:read`.
      parameters:
        - $ref: "#/components/parameters/status"
      responses:
        "200": { description: Approval list }
  /api/v1/script-approvals/{id}/approve:
    post:
      summary: Approve pending script approval
      description: Requires `script:approve`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Approval summary }
  /api/v1/script-approvals/{id}/reject:
    post:
      summary: Reject pending script approval
      description: Requires `script:approve`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Approval summary }
  /api/v1/tasks:
    get:
      summary: List task runs
      description: Requires `task:read`.
      responses:
        "200": { description: Task run list }
    post:
      summary: Create task run
      description: Requires `task:execute`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskPayload"
      responses:
        "200": { description: Task detail }
  /api/v1/tasks/{id}:
    get:
      summary: Get task detail
      description: Requires `task:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Task detail }
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Cancel pending or queued task
      description: Requires `task:cancel`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/tasks/{id}/targets:
    get:
      summary: List task targets
      description: Requires `task:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Target list }
  /api/v1/tasks/{id}/logs:
    get:
      summary: Query task logs
      description: Requires `task:log:read`.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/afterSequence"
      responses:
        "200": { description: Task logs }
  /api/v1/tasks/{id}/targets/{targetId}/logs:
    get:
      summary: Query target logs
      description: Requires `task:log:read`.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: targetId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/afterSequence"
      responses:
        "200": { description: Target logs }
  /api/v1/tasks/{id}/logs/stream:
    get:
      summary: Stream task logs with SSE
      description: Requires `task:log:read`. Emits `ready`, `heartbeat`, `log`, and `error` events.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: targetId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/afterSequence"
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/agent/tasks/poll:
    get:
      security:
        - agentTokenAuth: []
      summary: Agent polls queued targets
      responses:
        "200": { description: Agent task list }
  /api/v1/agent/tasks/{targetId}/claim:
    post:
      security:
        - agentTokenAuth: []
      summary: Agent claims target execution
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Agent task }
  /api/v1/agent/tasks/{targetId}/status:
    get:
      security:
        - agentTokenAuth: []
      summary: Agent checks current target state
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Target state, including cancel requests }
  /api/v1/agent/tasks/{targetId}/logs:
    post:
      security:
        - agentTokenAuth: []
      summary: Agent uploads task log chunk
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /api/v1/agent/tasks/{targetId}/result:
    post:
      security:
        - agentTokenAuth: []
      summary: Agent reports target result
      parameters:
        - name: targetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
  /api/v1/schedules:
    get:
      summary: List schedules
      description: Requires `schedule:read`.
      parameters:
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/status"
        - name: taskId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200": { description: Paged schedule list }
    post:
      summary: Create Cron schedule
      description: Requires `schedule:write`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePayload"
      responses:
        "200": { description: Schedule summary }
  /api/v1/schedules/{id}/pause:
    post:
      summary: Pause schedule
      description: Requires `schedule:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/schedules/{id}/resume:
    post:
      summary: Resume schedule
      description: Requires `schedule:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/schedules/{id}/disable:
    post:
      summary: Disable schedule
      description: Requires `schedule:write`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/schedules/preview:
    post:
      summary: Preview next Cron fire times
      description: Requires `schedule:read`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreviewPayload"
      responses:
        "200": { description: Next fire times }
  /api/v1/schedules/{id}/triggers:
    get:
      summary: List schedule trigger history
      description: Requires `schedule:read`.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Schedule trigger list }
  /api/v1/webhooks/trigger/{token}:
    post:
      security: []
      summary: Trigger webhook source
      description: Requires a valid source token, HMAC signature, `X-OpsPilot-Timestamp`, and `X-OpsPilot-Nonce`.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: X-OpsPilot-Signature
          in: header
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          schema: { type: string }
        - name: X-OpsPilot-Timestamp
          in: header
          schema: { type: string, example: "1735689600" }
        - name: X-OpsPilot-Nonce
          in: header
          schema: { type: string, example: "nonce-123" }
        - name: X-Delivery-Id
          in: header
          schema: { type: string }
        - name: X-Event-Type
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Trigger result with matched task runs }
  /api/v1/webhooks/sources:
    get:
      summary: List webhook sources
      description: Requires `webhook:read`.
      responses:
        "200": { description: Source list }
    post:
      summary: Create webhook source
      description: Requires `webhook:manage`. Returns trigger token and signing secret once.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSourcePayload"
      responses:
        "200": { description: Source detail with one-time trigger token and signing secret }
  /api/v1/webhooks/sources/{id}/rotate-secret:
    post:
      summary: Rotate webhook source signing secret and optional trigger token
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotateToken: { type: boolean, default: false }
      responses:
        "200": { description: Source detail with one-time signing secret and optional trigger token }
  /api/v1/webhooks/sources/{id}/pause:
    post:
      summary: Pause webhook source
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/sources/{id}/resume:
    post:
      summary: Resume webhook source
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/sources/{id}/disable:
    post:
      summary: Disable webhook source
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/rules:
    get:
      summary: List webhook rules
      description: Requires `webhook:read`.
      responses:
        "200": { description: Rule list }
    post:
      summary: Create webhook rule
      description: Requires `webhook:manage`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRulePayload"
      responses:
        "200": { description: Rule summary }
  /api/v1/webhooks/rules/{id}:
    put:
      summary: Update webhook rule
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                eventType: { type: string }
                matcher:
                  type: object
                  properties:
                    conditions:
                      type: array
                      items:
                        type: object
                        required: [type]
                        properties:
                          type: { type: string, enum: [header_equals, payload_equals, payload_contains, payload_not_equals, payload_exists, payload_regex, event_type_equals, ref_equals, branch_equals] }
                          key: { type: string, example: X-GitHub-Event }
                          path: { type: string, example: commits[*].author.name }
                          value: { type: string, example: push, description: Optional only for `payload_exists`; otherwise required. }
      responses:
        "200": { description: Updated rule summary }
  /api/v1/webhooks/rules/{id}/pause:
    post:
      summary: Pause webhook rule
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/rules/{id}/resume:
    post:
      summary: Resume webhook rule
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/rules/{id}/disable:
    post:
      summary: Disable webhook rule
      description: Requires `webhook:manage`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: OK }
  /api/v1/webhooks/matcher/simulate:
    post:
      summary: Simulate webhook matcher evaluation
      description: Requires `webhook:manage`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleId: { type: string }
                eventType: { type: string }
                headers:
                  type: object
                  additionalProperties: { type: string }
                payload:
                  type: string
                matcher:
                  type: object
                  properties:
                    conditions:
                      type: array
                      items:
                        type: object
                        required: [type]
                        properties:
                          type: { type: string, enum: [header_equals, payload_equals, payload_contains, payload_not_equals, payload_exists, payload_regex, event_type_equals, ref_equals, branch_equals] }
                          key: { type: string }
                          path: { type: string }
                          value: { type: string, description: Optional only for `payload_exists`; otherwise required. }
      responses:
        "200": { description: Matcher simulation result }
