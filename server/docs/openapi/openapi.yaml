        "200":
          description: Workflow definition detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDetail"
    put:
      summary: Update workflow definition
      description: Requires `workflow:manage`. Updating an active workflow returns it to draft status.
