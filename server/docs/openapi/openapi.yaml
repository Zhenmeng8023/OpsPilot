          in: query
          schema: { type: string, enum: [received, ignored, triggered, failed, rejected] }
        - name: deliveryId
          in: query
          schema: { type: string }
        - name: receivedFrom
          in: query
          schema: { type: string, example: "2026-05-01 00:00:00" }
        - name: receivedTo
          in: query
          schema: { type: string, example: "2026-05-08 23:59:59" }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
